services:
  - type: web
    name: glowing-diya
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glowing-diya-db
          property: connectionString

databases:
  - name: glowing-diya-db
    plan: free
    databaseName: glowing_diya
    user: glowing_diya
